<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BASEMAXPRO | Wealth Management</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1020;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      position: relative;
    }

    /* =========================
       LEFT BRAND PANEL
    ========================== */
    .brand-panel {
      width: 52%;
      min-height: 100vh;
      background:
        radial-gradient(circle at 30% 20%, rgba(49, 130, 206, 0.18), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.15), transparent 35%),
        linear-gradient(135deg, #0a1020 0%, #111a31 55%, #0c1428 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }

    .brand-panel::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 50%;
      top: -180px;
      left: -180px;
    }

    .brand-panel::after {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 50%;
      right: -350px;
      bottom: -350px;
    }

    .brand-content {
      max-width: 620px;
      position: relative;
      z-index: 2;
    }

    .brand-logo {
      font-size: clamp(46px, 7vw, 92px);
      font-weight: 900;
      letter-spacing: -4px;
      line-height: 0.95;
      color: #ffffff;
      margin-bottom: 28px;
    }

    .brand-logo span {
      color: #3b82f6;
    }

    .brand-subtitle {
      font-size: 18px;
      color: #94a3b8;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 34px;
    }

    .brand-description {
      max-width: 520px;
      font-size: 16px;
      line-height: 1.8;
      color: #cbd5e1;
    }

    .brand-line {
      width: 90px;
      height: 4px;
      background: #3b82f6;
      border-radius: 10px;
      margin-bottom: 28px;
    }

    /* =========================
       LOGIN PANEL
    ========================== */
    .login-panel {
      width: 48%;
      min-height: 100vh;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #0f172a;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
    }

    .login-header {
      margin-bottom: 34px;
    }

    .login-header h1 {
      font-size: 34px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 54px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: #0f172a;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    .form-input.input-error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.08);
    }

    .password-input {
      padding-right: 54px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      color: #64748b;
      font-size: 18px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .toggle-password:hover {
      background: #f1f5f9;
      color: #334155;
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -8px;
      margin-bottom: 22px;
    }

    .forgot-password {
      border: none;
      background: transparent;
      color: #2563eb;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button.loading {
      cursor: wait;
      opacity: 0.85;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .login-button.loading .spinner {
      display: block;
    }

    .login-button.loading .button-text {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }

    /* =========================
       CONTACT BUTTONS
    ========================== */
    .contact-buttons {
      position: fixed;
      right: 22px;
      bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
    }

    .contact-button {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .contact-button:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
    }

    .contact-button svg {
      width: 29px;
      height: 29px;
      fill: #ffffff;
    }

    .telegram-button {
      background: #229ed9;
    }

    .email-button {
      background: #2563eb;
    }

    .whatsapp-button {
      background: #25d366;
    }

    /* =========================
       TOAST
    ========================== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(30px);
      min-width: 300px;
      max-width: calc(100vw - 40px);
      background: rgba(15, 23, 42, 0.96);
      color: #ffffff;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 10000;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .toast-message {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    /* =========================
       RESPONSIVE
    ========================== */
    @media (max-width: 900px) {
      .page {
        display: block;
      }

      .brand-panel {
        width: 100%;
        min-height: 270px;
        padding: 45px 30px;
      }

      .brand-content {
        max-width: 700px;
      }

      .brand-logo {
        font-size: 58px;
      }

      .brand-subtitle {
        margin-bottom: 20px;
      }

      .brand-description {
        display: none;
      }

      .login-panel {
        width: 100%;
        min-height: calc(100vh - 270px);
        padding: 45px 25px 100px;
      }
    }

    @media (max-width: 480px) {
      .brand-panel {
        min-height: 220px;
        padding: 35px 22px;
      }

      .brand-logo {
        font-size: 48px;
        letter-spacing: -2px;
      }

      .brand-subtitle {
        font-size: 13px;
        letter-spacing: 2px;
      }

      .login-panel {
        padding: 35px 20px 100px;
      }

      .login-header h1 {
        font-size: 29px;
      }

      .contact-buttons {
        right: 14px;
        bottom: 14px;
        gap: 9px;
      }

      .contact-button {
        width: 50px;
        height: 50px;
      }

      .contact-button svg {
        width: 25px;
        height: 25px;
      }

      .toast {
        bottom: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- =========================
         BRAND PANEL
    ========================== -->
    <section class="brand-panel">
      <div class="brand-content">

        <div class="brand-line"></div>

        <div class="brand-logo">
          BASEMAX<span>PRO</span>
        </div>

        <div class="brand-subtitle">
          Wealth Management
        </div>

        <p class="brand-description">
          Soluciones profesionales para la gestión y administración
          de patrimonio. Accede a tu cuenta para continuar.
        </p>

      </div>
    </section>


    <!-- =========================
         LOGIN PANEL
    ========================== -->
    <section class="login-panel">
      <div class="login-card">

        <div class="login-header">
          <h1>Iniciar sesión</h1>
          <p>
            Introduce tu teléfono o número de cuenta y tu contraseña
            para acceder.
          </p>
        </div>

        <form id="loginForm">

          <div class="form-group">
            <label class="form-label" for="username">
              Teléfono / Número de cuenta
            </label>

            <div class="input-wrapper">
              <input
                id="username"
                name="username"
                type="text"
                class="form-input"
                placeholder="Introduce tu teléfono o cuenta"
                minlength="9"
                autocomplete="username"
              />
            </div>
          </div>


          <div class="form-group">
            <label class="form-label" for="password">
              Contraseña
            </label>

            <div class="input-wrapper">
              <input
                id="password"
                name="password"
                type="password"
                class="form-input password-input"
                placeholder="Introduce tu contraseña"
                minlength="3"
                autocomplete="current-password"
              />

              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Mostrar contraseña"
              >
                👁
              </button>
            </div>
          </div>


          <div class="forgot-row">
            <button
              type="button"
              class="forgot-password"
              id="forgotPassword"
            >
              ¿Olvidaste tu contraseña?
            </button>
          </div>


          <button
            type="submit"
            class="login-button"
            id="loginButton"
          >
            <span class="button-text">Iniciar sesión</span>
            <span class="spinner"></span>
          </button>

        </form>


        <div class="login-footer">
          © 2026 BASEMAXPRO. Todos los derechos reservados.
        </div>

      </div>
    </section>

  </div>


  <!-- =========================
       CONTACT BUTTONS
  ========================== -->
  <div class="contact-buttons">

    <!-- Telegram -->
    <a
      href="https://t.me/BASE_CasaDeBolsaMX"
      class="contact-button telegram-button"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Contactar por Telegram"
      title="Telegram"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.8 3.2c.3-1.2-.4-1.7-1.4-1.3L2.1 9.1c-1.2.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.7c.2.6.1.9.7.9.5 0 .7-.2 1-.4.3-.3 1.1-1.1 2.1-2.1l5.1-3.8 5.3 3.9c1 .6 1.7.3 1.9-.9l3-14.7zM7.3 11.7l11.8-7.4c.6-.4 1.1-.2.7.2l-9.7 8.8-.4 3.5-1.7-5.1-.7-.2z"/>
      </svg>
    </a>


    <!-- Email -->
    <a
      href="mailto:BASECasaDeBolsaMX@gmail.com"
      class="contact-button email-button"
      aria-label="Enviar correo electrónico"
      title="Correo electrónico"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
      </svg>
    </a>


    <!-- WhatsApp -->
    <button
      type="button"
      class="contact-button whatsapp-button"
      id="whatsappButton"
      aria-label="WhatsApp"
      title="WhatsApp"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12.04 2C6.5 2 2 6.5 2 12.03c0 1.77.46 3.5 1.33 5.03L2 22l5.08-1.3a10 10 0 0 0 4.96 1.27h.01C17.58 21.97 22 17.47 22 12.03 22 6.5 17.58 2 12.04 2zm0 18.3c-1.55 0-3.07-.42-4.4-1.22l-.31-.18-3.02.77.81-2.94-.2-.32a8.3 8.3 0 1 1 7.12 3.89zm4.55-6.23c-.25-.12-1.47-.73-1.7-.81-.23-.08-.4-.12-.57.12-.17.25-.65.81-.8.98-.15.17-.3.19-.55.06-.25-.12-1.04-.38-1.98-1.22-.73-.65-1.22-1.45-1.36-1.7-.14-.25-.02-.38.1-.5.11-.11.25-.3.37-.45.12-.15.16-.25.25-.42.08-.17.04-.32-.02-.45-.06-.12-.57-1.37-.78-1.87-.2-.48-.41-.41-.57-.42h-.49c-.17 0-.45.06-.69.32-.24.25-.9.88-.9 2.14 0 1.26.92 2.47 1.05 2.64.12.17 1.8 2.76 4.37 3.87.61.26 1.09.42 1.46.54.61.19 1.16.16 1.59.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.1-.23-.16-.48-.28z"/>
      </svg>
    </button>

  </div>


  <!-- =========================
       TOAST
  ========================== -->
  <div class="toast" id="toast">
    <div class="toast-title" id="toastTitle"></div>
    <div class="toast-message" id="toastMessage"></div>
  </div>


  <script>
    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const togglePassword = document.getElementById("togglePassword");
    const forgotPassword = document.getElementById("forgotPassword");
    const whatsappButton = document.getElementById("whatsappButton");

    const toast = document.getElementById("toast");
    const toastTitle = document.getElementById("toastTitle");
    const toastMessage = document.getElementById("toastMessage");

    let toastTimer;


    /* =========================
       TOAST FUNCTION
    ========================== */
    function showToast(title, message) {
      toastTitle.textContent = title;
      toastMessage.textContent = message;

      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }


    /* =========================
       PASSWORD SHOW / HIDE
    ========================== */
    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";

      togglePassword.textContent = isPassword ? "🙈" : "👁";

      togglePassword.setAttribute(
        "aria-label",
        isPassword ? "Ocultar contraseña" : "Mostrar contraseña"
      );
    });


    /* =========================
       FORGOT PASSWORD
    ========================== */
    forgotPassword.addEventListener("click", () => {
      showToast(
        "提示",
        "请联系官方人员处理"
      );
    });


    /* =========================
       WHATSAPP
    ========================== */
    whatsappButton.addEventListener("click", () => {
      showToast(
        "WhatsApp",
        "暂时暂停WhatsApp处理业务"
      );
    });


    /* =========================
       LOGIN
    ========================== */
    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      usernameInput.classList.remove("input-error");
      passwordInput.classList.remove("input-error");


      /* Username validation */
      if (username.length < 9) {
        usernameInput.classList.add("input-error");
        usernameInput.focus();

        showToast(
          "Datos incompletos",
          "Introduce un teléfono o número de cuenta de al menos 9 caracteres."
        );

        return;
      }


      /* Password validation */
      if (password.length < 3) {
        passwordInput.classList.add("input-error");
        passwordInput.focus();

        showToast(
          "Datos incompletos",
          "Introduce una contraseña de al menos 3 caracteres."
        );

        return;
      }


      /* Loading state */
      loginButton.classList.add("loading");
      loginButton.disabled = true;


      /*
        Demo behavior:
        No credentials are sent or stored.
      */
      setTimeout(() => {

        loginButton.classList.remove("loading");
        loginButton.disabled = false;

        showToast(
          "Acceso no disponible",
          "No se pudo completar el inicio de sesión debido a restricciones de red."
        );

      }, 1500);
    });


    /* =========================
       REMOVE ERROR WHEN USER TYPES
    ========================== */
    usernameInput.addEventListener("input", () => {
      usernameInput.classList.remove("input-error");
    });

    passwordInput.addEventListener("input", () => {
      passwordInput.classList.remove("input-error");
    });

  </script>

</body>
</html>
